name: Build binaries
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pandas
      - run: pyinstaller --onefile --name financemanager main.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/financemanager.exe financemanager-windows.exe
      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf financemanager-${{ matrix.name }}.tar.gz -C dist financemanager
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            financemanager-windows.exe
            financemanager-*.tar.gz